name: cicd

on:
  push:
    branches:
      - main
      - 'feature/*'

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Save SSH key and giving permission
      run: |
        echo "${{ secrets.SSH_KEY }}" > windows.pem
        echo icacls windows.pem /grant "%USERNAME%:F" /inheritance:r
        
      
    - name: Set connection to ec2
      run: |
        echo ssh -i windows.pem ubuntu@ec2-13-235-70-140.ap-south-1.compute.amazonaws.com << EOF
        git pull
        
    
