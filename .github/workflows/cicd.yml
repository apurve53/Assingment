name: cicd

on:
  push:
    branches: main 

jobs:
  Deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v2 
      - name: Build & Deploy
        env:
            PRIVATE_KEY: ${{ secrets.SSH_KEY }}
            HOSTNAME: ${{secrets.DNS}}
            USER_NAME: ${{secrets.USER_NAME}}
            GITHUB_ACTOR: ${{ secrets.GITACtore }}
            GIT_USER: ${{ secrets.GIT_USER }}
      
        run: |
          echo "$PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem
          ssh -o StrictHostKeyChecking=no -i private_key.pem ${USER_NAME}@${HOSTNAME}  << 'EOF'
          # Now we have got the access of EC2 and we will start the deploy .
          cd /home/ubuntu/Assingment
          echo "https://${GITHUB_ACTOR}:${GIT_USER}@github.com" > ~/.git-credentials
          cat ~/.git-credentials

          # Perform Git operations
          git checkout main
          git fetch --all
          git reset --hard origin/main
          git pull origin main
          EOF
        