<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cookie Example</title>
</head>

<body>
  <h1>Cookie Example</h1>
  <button id="checkPropertyBtn">Check Property in Cookies</button>
  <button id="addPropertyBtn">Add Property to Cookies</button>
  <button id="logCookiesBtn">Log Cookies</button>

  <script>
    document.getElementById('addPropertyBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('/add-property');
        const text = await response.text();
        console.log(text);
        console.log("cookies :", document.cookie);
      } catch (error) {
        console.error('Error adding property:', error);
      }
    });

    document.getElementById('checkPropertyBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('/check-property');
        const text = await response.text();
        console.log(text);
      } catch (error) {
        console.error('Error checking property:', error);
      }
    });

    document.getElementById('logCookiesBtn').addEventListener('click', async () => {
      try {
        const response = await fetch('/log-cookies');
        const text = await response.text();
        console.log(text);
        console.log("cookies :", document.cookie);
      } catch (error) {
        console.error('Error logging cookies:', error);
      }
    });
  </script>
</body>

</html>
